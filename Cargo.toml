[workspace]
resolver = "2"
members = [
    "crates/modular-agent-macros",
    "crates/modular-agent-core",
    "crates/modular-agent-std",
    "crates/modular-agent-llm",
    "crates/tauri-plugin-modular-agent",
    "apps/desktop/src-tauri",
    "apps/cli",
]
# ma-config must build even when an app manifest points at a custom_agents/
# clone that is missing or broken — that is the state it exists to fix — so it
# stays out of the workspace.
exclude = ["tools/ma-config"]

[workspace.package]
edition = "2024"
authors = ["Akira Ishino <akira@lumilab.jp>"]
license = "Apache-2.0"
repository = "https://github.com/modular-agent/modular-agent"

[workspace.dependencies]
# In-tree crates: `path` is what the workspace builds against, `version` is what
# a published crate records for its dependents. Each crate keeps its own semver
# line; only core and macros are bumped together.
modular-agent-macros = { version = "0.28.0", path = "crates/modular-agent-macros" }
modular-agent-core = { version = "0.28.0", path = "crates/modular-agent-core" }
modular-agent-std = { version = "0.18.0", path = "crates/modular-agent-std" }
modular-agent-llm = { version = "0.16.0", path = "crates/modular-agent-llm" }
tauri-plugin-modular-agent = { version = "0.19.0", path = "crates/tauri-plugin-modular-agent" }

# Shared external dependencies. Crates whose feature sets diverge (tokio,
# reqwest) keep their own entries.
async-trait = "0.1"
im = { version = "15.1.0", features = ["serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
