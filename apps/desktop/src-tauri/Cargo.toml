[package]
name = "modular-agent-desktop"
version = "0.17.0"
description = "Modular Agent Desktop Application"
authors = ["Akira Ishino <akira@lumilab.jp>"]
edition = "2021"
license = "Apache-2.0"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "modular_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
ctrlc = "3.4.5"
dirs = "6.0"
log = "0.4.25"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["full"] }
modular-agent-core = { version = "0.25.0", features = ["mcp-server"] }
tauri-plugin-modular-agent = "0.16.0"
modular-agent-audio = { git = "https://github.com/modular-agent/modular-agent-audio.git" }
modular-agent-lifelog = { git = "https://github.com/modular-agent/modular-agent-lifelog.git" }
modular-agent-llm = { git = "https://github.com/modular-agent/modular-agent-llm.git" }
modular-agent-monty = { git = "https://github.com/modular-agent/modular-agent-monty.git" }
modular-agent-slack = { git = "https://github.com/modular-agent/modular-agent-slack.git" }
modular-agent-sqlx = { git = "https://github.com/modular-agent/modular-agent-sqlx.git" }
modular-agent-std = { git = "https://github.com/modular-agent/modular-agent-std.git" }
modular-agent-voicevox = { git = "https://github.com/modular-agent/modular-agent-voicevox.git" }
modular-agent-web = { git = "https://github.com/modular-agent/modular-agent-web.git" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.3"
tauri-plugin-window-state = "2"

# core 0.25.0 and plugin 0.16.0 are not yet published to crates.io; build
# against the sibling checkouts until they are released.
[patch.crates-io]
modular-agent-core = { path = "../../modular-agent-core/modular-agent-core" }
tauri-plugin-modular-agent = { path = "../../tauri-plugin-modular-agent" }

# The upstream agent repos still require core ^0.24, which the path-patched
# 0.25 cannot satisfy — cargo would silently resolve a second, registry copy
# of core whose inventory-based agent registry is disjoint from the app's, so
# none of these crates' agents would be registered. Use the sibling checkouts
# (core dep bumped to 0.25) until the repos are updated. Cargo.lock must
# contain exactly one modular-agent-core entry.
[patch."https://github.com/modular-agent/modular-agent-audio.git"]
modular-agent-audio = { path = "../../modular-agent-audio" }
[patch."https://github.com/modular-agent/modular-agent-lifelog.git"]
modular-agent-lifelog = { path = "../../modular-agent-lifelog" }
[patch."https://github.com/modular-agent/modular-agent-llm.git"]
modular-agent-llm = { path = "../../modular-agent-llm" }
[patch."https://github.com/modular-agent/modular-agent-monty.git"]
modular-agent-monty = { path = "../../modular-agent-monty" }
[patch."https://github.com/modular-agent/modular-agent-slack.git"]
modular-agent-slack = { path = "../../modular-agent-slack" }
[patch."https://github.com/modular-agent/modular-agent-sqlx.git"]
modular-agent-sqlx = { path = "../../modular-agent-sqlx" }
[patch."https://github.com/modular-agent/modular-agent-std.git"]
modular-agent-std = { path = "../../modular-agent-std" }
[patch."https://github.com/modular-agent/modular-agent-voicevox.git"]
modular-agent-voicevox = { path = "../../modular-agent-voicevox" }
[patch."https://github.com/modular-agent/modular-agent-web.git"]
modular-agent-web = { path = "../../modular-agent-web" }
