[package]
name = "modular-agent-std"
version = "0.16.0"
description = "Standard Agents of Modular Agent"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4"
cron = "0.17"
glob = "0.3.3"
handlebars = "6"
im = { workspace = true }
log = { workspace = true }
mini-moka = "0.10.3"
modular-agent-core = { workspace = true }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { version = "0.10.0", optional = true }
tokio = { version = "1", features = ["time"] }

[features]
default = ["image", "yaml"]
image = []
test-utils = ["modular-agent-core/test-utils", "tokio/macros"]
yaml = ["serde_yaml_ng"]

[[test]]
name = "main_test"
path = "tests/main_test.rs"
required-features = ["test-utils"]
