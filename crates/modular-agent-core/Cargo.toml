[package]
name = "modular-agent-core"
version = "0.29.0"
description = "Modular Agent Core"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
# mcp-server only: serves the rmcp streamable-http tower service.
axum = { version = "0.8", optional = true }
# default-features = false + clock: only Utc::now() is needed for RFC3339
# session timestamps.
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock"] }
fnv = "1"
# default-features = false + alloc: only the order-preserving stream
# combinators (buffered) are needed for parallel tool execution.
futures-util = { version = "0.3", optional = true, default-features = false, features = ["alloc"] }
# mcp-http-client only: HeaderName/HeaderValue for custom request headers
# (rmcp does not re-export the http crate).
http = { version = "1", optional = true }
im = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
inventory = "0.3"
# default-features = false: default features pull schema-resolving backends
# (file/http via reqwest) that are unneeded for validating local tool schemas.
jsonschema = { version = "0.48.1", optional = true, default-features = false }
log = { workspace = true }
parking_lot = { workspace = true }
photon-rs = { version = "0.3.3", optional = true }
regex = { version = "1.12.2", optional = true }
rmcp = { version = "3.1", features = ["client", "transport-child-process"], optional = true }
# mcp-server only: JsonSchema derive for MCP tool parameter types (same major
# version as rmcp's schemars so the derives are compatible).
schemars = { version = "1.1", optional = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
# default-features = false + rt: only CancellationToken (tokio_util::sync) and
# TaskTracker (tokio_util::task, for graceful shutdown) are used.
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# v4: random session/entry ids that stay unique across process restarts
# (the counter-based internal id generator is not).
uuid = { version = "1", optional = true, features = ["v4"] }

modular-agent-macros = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "io-util", "io-std", "signal"] }
serial_test = "3"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
tempfile = "3"

[features]
default = ["file", "image", "llm", "mcp"]
file = []
image = ["photon-rs"]
# tokio/fs + tokio/io-util: used only by the session module (JSONL persistence).
llm = ["regex", "jsonschema", "futures-util", "uuid", "chrono", "tokio/fs", "tokio/io-util"]
mcp = ["rmcp", "llm"]
# Streamable HTTP client transport for remote MCP servers ("url" entries in
# mcp.json). Opt-in so the default build does not pull reqwest into every
# crates.io consumer. rmcp/reqwest is needed on top of the transport feature
# to get a TLS backend (rustls).
mcp-http-client = [
    "mcp",
    "rmcp/transport-streamable-http-client-reqwest",
    "rmcp/reqwest",
    "dep:http",
]
# Built-in MCP server (streamable HTTP) exposing flow-editing tools to
# external agents. Implies "file" because the save_patch tool writes patches
# to disk.
mcp-server = [
    "file",
    "rmcp",
    "rmcp/server",
    "rmcp/macros",
    "rmcp/transport-streamable-http-server",
    "dep:axum",
    "dep:schemars",
    "tokio/net",
]
test-utils = []

[[test]]
name = "main_test"
path = "tests/main_test.rs"
required-features = ["test-utils"]

# harness = false: the binary re-executes itself as a mock MCP stdio server
# (see tests/mcp_lifecycle_test.rs), which needs control over main().
[[test]]
name = "mcp_lifecycle_test"
path = "tests/mcp_lifecycle_test.rs"
harness = false
required-features = ["mcp"]

[[example]]
name = "cli"
path = "examples/cli.rs"
required-features = ["file"]
