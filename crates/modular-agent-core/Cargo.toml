[package]
name = "modular-agent-core"
version.workspace = true
description.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"

[dependencies]
async-trait = "0.1"
fnv = "1"
im = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
inventory = "0.3"
log = "0.4"
photon-rs = { version = "0.3.3", optional = true }
regex = { version = "1.12.2", optional = true }
rmcp = { version = "0.13.0", features = ["client", "transport-child-process"], optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1" }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }

modular-agent-macros = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "io-util", "io-std", "signal"] }
serial_test = "3"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

[features]
default = ["file", "image", "llm", "mcp"]
file = []
image = ["photon-rs"]
llm = ["regex"]
mcp = ["rmcp", "llm"]
test-utils = []

[[test]]
name = "main_test"
path = "tests/main_test.rs"
required-features = ["test-utils"]

# harness = false: the binary re-executes itself as a mock MCP stdio server
# (see tests/mcp_lifecycle_test.rs), which needs control over main().
[[test]]
name = "mcp_lifecycle_test"
path = "tests/mcp_lifecycle_test.rs"
harness = false
required-features = ["mcp"]

[[example]]
name = "cli"
path = "examples/cli.rs"
required-features = ["file"]
