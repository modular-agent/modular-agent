[package]
name = "modular-agent-web"
version = "0.9.0"
description = "Web Agents for Modular Agent"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
html-to-markdown-rs = { version = "3.9.0", optional = true }
quick-xml = { version = "0.41", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
scraper = { version = "0.27.0", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = "2.5.7"

modular-agent-core = { workspace = true }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["fetch-url", "html-scraper", "html-to-markdown", "searxng", "yt-transcript"]
fetch-url = []
html-scraper = ["scraper"]
html-to-markdown = ["html-to-markdown-rs"]
searxng = []
yt-transcript = ["quick-xml"]
