[package]
name = "modular-agent-web"
version = "0.8.0"
description = "Web Agents for Modular Agent"
authors = ["Akira Ishino <akira@lumilab.jp>"]
edition = "2024"
license = "Apache-2.0 OR MIT"

[dependencies]
html-to-markdown-rs = { version = "2.14.0", optional = true }
reqwest = { version = "0.12.25", default-features = false, features = ["json"] }
scraper = { version = "0.25.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.7"
yt-transcript-rs = { version = "0.1.8", optional = true }

modular-agent-core = "0.25.0"

[features]
default = ["rustls-tls", "fetch-url", "html-scraper", "html-to-markdown", "yt-transcript"]
default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]
fetch-url = []
html-scraper = ["scraper"]
html-to-markdown = ["html-to-markdown-rs"]
yt-transcript = ["yt-transcript-rs"]

# [patch.crates-io]
# modular-agent-core = { path = "../modular-agent-core/modular-agent-core" }
