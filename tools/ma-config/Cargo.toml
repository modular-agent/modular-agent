# Standalone: never joins the surrounding workspace, wherever the repo is
# checked out (the root manifest's exclude only matches the primary checkout).
[workspace]

[package]
name = "ma-config"
version = "0.1.0"
description = "TUI wizard for choosing which module crates the Modular Agent apps link"
authors = ["Akira Ishino <akira@lumilab.jp>"]
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "ma-config"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "1"
toml_edit = "0.25"
