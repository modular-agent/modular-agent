# Catalog of the in-tree agent crates the wizard can offer.
#
# Only crates that live under crates/ in this workspace belong here; every entry
# must set in_tree: true. An out-of-tree agent describes itself in a
# ma-registry.yaml at the root of its own repository, which the wizard reads
# from the clone under custom_agents/ — so only cloned crates are offered, and
# custom_agents/README.md lists what can be cloned.
#
# - in_tree: true       lives under crates/ in this workspace; always linked as a
#                       plain workspace dependency, no source to choose.
# - default_for:        apps that pre-select the agent on a fresh configuration.
#
# modular-agent-core and tauri-plugin-modular-agent are in-tree and always
# linked, so they are not listed here.

agents:
  - name: modular-agent-llm
    description: LLM agents (OpenAI, Anthropic, Google, etc.)
    in_tree: true
    available_features:
      - image
      - claude
      - ollama
      - openai
    default_features:
      - image
      - claude
      - ollama
      - openai
    conflicts:
      - with: modular-agent-duckdb
        reason: CRT mismatch on Windows
        platform: windows
    default_for: [desktop, cli]

  - name: modular-agent-std
    description: Standard agents (timer, template, file, etc.)
    in_tree: true
    available_features:
      - image
      - yaml
      - watch
    default_features:
      - image
      - yaml
      - watch
    default_for: [desktop, cli]

  - name: modular-agent-web
    description: Web/HTTP, scraping, search, YouTube agents
    in_tree: true
    available_features:
      - fetch-url
      - html-scraper
      - html-to-markdown
      - searxng
      - yt-transcript
    default_features:
      - fetch-url
      - html-scraper
      - html-to-markdown
      - searxng
      - yt-transcript
    default_for: [desktop, cli]
